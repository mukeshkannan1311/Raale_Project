version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmatrace_postgres
    restart: always
    environment:
      POSTGRES_USER: pharmatrace
      POSTGRES_PASSWORD: pharmatrace_password
      POSTGRES_DB: pharmatrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrace -d pharmatrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmatrace_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://pharmatrace:pharmatrace_password@postgres:5432/pharmatrace_db
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmatrace_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
